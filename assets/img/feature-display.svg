<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Super Retina XDR display brightness and HDR">
  <defs>
    <linearGradient id="c4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151821"/><stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="c4screen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0e2a2a"/><stop offset="0.35" stop-color="#1d5a3c"/>
      <stop offset="0.62" stop-color="#7aa32c"/><stop offset="0.85" stop-color="#d8c02a"/>
      <stop offset="1" stop-color="#e0a12a"/>
    </linearGradient>
    <linearGradient id="c4body" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#454c60"/><stop offset="0.5" stop-color="#242a38"/><stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <linearGradient id="c4ray" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c4bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e6f8f"/><stop offset="0.5" stop-color="#ffd23f"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#c4bg)"/>

  <!-- light rays -->
  <g fill="url(#c4ray)">
    <path d="M250 120 L216 40 L246 40 Z" opacity="0.7"/>
    <path d="M320 108 L306 26 L336 26 Z" opacity="0.9"/>
    <path d="M390 120 L394 40 L424 40 Z" opacity="0.7"/>
  </g>

  <!-- phone -->
  <rect x="222" y="100" width="196" height="300" rx="38" fill="url(#c4body)"/>
  <rect x="222" y="100" width="196" height="300" rx="38" fill="none" stroke="#6d7893" stroke-opacity="0.5"/>
  <rect x="232" y="110" width="176" height="280" rx="31" fill="url(#c4screen)"/>
  <path d="M268 110 h104 a0 0 0 0 1 0 26 h-104 a0 0 0 0 1 0 -26 Z" fill="#05070c"/>

  <!-- specular highlight -->
  <ellipse cx="300" cy="200" rx="70" ry="46" fill="#ffffff" opacity="0.10" transform="rotate(-28 300 200)"/>

  <!-- brightness markers -->
  <g font-family="Helvetica,Arial,sans-serif">
    <path d="M420 180 H470" stroke="#ffd23f" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="476" y="176" font-size="13" font-weight="700" fill="#ffd23f">800</text>
    <text x="476" y="192" font-size="11" fill="#8d97ad">nits typical</text>

    <path d="M420 268 H470" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="476" y="264" font-size="13" font-weight="700" fill="#ffffff">1600</text>
    <text x="476" y="280" font-size="11" fill="#8d97ad">nits HDR peak</text>
  </g>

  <!-- HDR bar -->
  <g transform="translate(60 424)">
    <rect x="0" y="0" width="200" height="10" rx="5" fill="url(#c4bar)" opacity="0.9"/>
    <text x="212" y="10" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8d97ad" letter-spacing="1.5">HDR10 · HLG · Dolby Vision</text>
  </g>

  <!-- title -->
  <g font-family="Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="320" y="66" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.5">6.1&quot; SUPER RETINA XDR</text>
    <text x="320" y="86" font-size="12" fill="#8d97ad" letter-spacing="1.5">2532 × 1170  ·  460 PPI</text>
  </g>
</svg>