<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="IP68 water resistance, 6 meters for 30 minutes">
  <defs>
    <linearGradient id="c7bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151821"/><stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="c7water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa9e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0f4e86" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="c7body" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffe47a"/><stop offset="0.45" stop-color="#f0c02f"/>
      <stop offset="1" stop-color="#b8891a"/>
    </linearGradient>
    <linearGradient id="c7bubble" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#c7bg)"/>

  <!-- water body -->
  <g>
    <path d="M0 150 Q 80 132 160 150 T 320 150 T 480 150 T 640 150 V480 H0 Z" fill="url(#c7water)"/>
    <path d="M0 150 Q 80 132 160 150 T 320 150 T 480 150 T 640 150" fill="none" stroke="#7fd4ff" stroke-opacity="0.8" stroke-width="2.5"/>
  </g>

  <!-- depth scale -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fd4ff" letter-spacing="1">
    <path d="M96 150 V450" stroke="#9fd4ff" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="4 5"/>
    <g>
      <path d="M88 450 H108" stroke="#9fd4ff" stroke-opacity="0.6" stroke-width="1.4"/>
      <text x="118" y="454">0 m</text>
      <path d="M88 350 H108" stroke="#9fd4ff" stroke-opacity="0.6" stroke-width="1.4"/>
      <text x="118" y="354">3 m</text>
      <path d="M88 250 H108" stroke="#9fd4ff" stroke-opacity="0.6" stroke-width="1.4"/>
      <text x="118" y="254">6 m</text>
    </g>
  </g>

  <!-- submerged phone -->
  <g transform="translate(250 152)">
    <rect x="0" y="0" width="164" height="292" rx="34" fill="url(#c7body)"/>
    <rect x="0" y="0" width="164" height="292" rx="34" fill="none" stroke="#fff3c4" stroke-opacity="0.5"/>
    <!-- camera bump -->
    <rect x="16" y="18" width="76" height="76" rx="24" fill="#e0a82b"/>
    <circle cx="40" cy="42" r="15" fill="#1b1f2b"/><circle cx="40" cy="42" r="7" fill="#0a0d15"/>
    <circle cx="72" cy="66" r="15" fill="#1b1f2b"/><circle cx="72" cy="66" r="7" fill="#0a0d15"/>
    <circle cx="74" cy="40" r="6" fill="#f7ecd0"/>
    <!-- apple-ish logo mark -->
    <g transform="translate(82 168)" fill="#8a6a1c" opacity="0.55">
      <circle cx="0" cy="4" r="18"/>
      <path d="M-2 -14 q 6 -10 14 -8 q -1 10 -9 12 z"/>
    </g>
    <!-- underwater tint -->
    <rect x="0" y="0" width="164" height="292" rx="34" fill="#1c6fa8" opacity="0.28"/>
  </g>

  <!-- waterline across phone -->
  <path d="M250 152 H414" stroke="#dff3ff" stroke-opacity="0.9" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- bubbles -->
  <g fill="url(#c7bubble)">
    <circle cx="466" cy="300" r="13"/><circle cx="500" cy="358" r="9"/><circle cx="440" cy="392" r="7"/>
    <circle cx="212" cy="322" r="11"/><circle cx="176" cy="386" r="8"/><circle cx="228" cy="420" r="6"/>
    <circle cx="486" cy="252" r="7"/><circle cx="166" cy="266" r="6"/>
  </g>

  <!-- droplets -->
  <g fill="#9fd4ff" opacity="0.8">
    <path d="M540 190 q 9 12 9 17 a 9 9 0 0 1 -18 0 q 0 -5 9 -17 z"/>
    <path d="M96 196 q 7 9 7 13 a 7 7 0 0 1 -14 0 q 0 -4 7 -13 z"/>
  </g>

  <!-- badges -->
  <g font-family="Helvetica,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(486 84)">
      <rect x="-84" y="-32" width="168" height="64" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#7fd4ff" stroke-opacity="0.4"/>
      <text x="0" y="-2" font-size="26" font-weight="800" fill="#7fd4ff" letter-spacing="1">IP68</text>
      <text x="0" y="18" font-size="10.5" fill="#c3cad8" letter-spacing="1.4">WATER RESISTANT</text>
    </g>
    <g transform="translate(154 84)">
      <rect x="-78" y="-32" width="156" height="64" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="0" y="-2" font-size="22" font-weight="800" fill="#ffffff">6 m</text>
      <text x="0" y="18" font-size="10.5" fill="#c3cad8" letter-spacing="1.4">FOR UP TO 30 MIN</text>
    </g>
  </g>
</svg>