<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Cinematic mode, Action mode and 4K video features">
  <defs>
    <linearGradient id="c8bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151821"/><stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="c8body" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#454c60"/><stop offset="0.5" stop-color="#242a38"/><stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <linearGradient id="c8rec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ad7ff"/><stop offset="1" stop-color="#2f8fd6"/>
    </linearGradient>
    <radialGradient id="c8lens" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#c8bg)"/>

  <!-- cinematic frame -->
  <g transform="translate(40 52)">
    <rect x="0" y="0" width="560" height="300" rx="18" fill="#0a0e17" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="14" y="14" width="532" height="272" rx="10" fill="#0f1523"/>

    <!-- blurred background bokeh -->
    <g>
      <circle cx="120" cy="120" r="40" fill="#ffd23f" opacity="0.18"/>
      <circle cx="200" cy="90" r="26" fill="#7ad7ff" opacity="0.20"/>
      <circle cx="430" cy="130" r="34" fill="#ff8fa3" opacity="0.18"/>
      <circle cx="330" cy="210" r="22" fill="#a8f5c4" opacity="0.16"/>
      <circle cx="500" cy="80" r="18" fill="#ffd23f" opacity="0.14"/>
      <!-- bokeh blur circles -->
      <g opacity="0.35">
        <circle cx="160" cy="190" r="16" fill="#ffffff" opacity="0.18"/>
        <circle cx="260" cy="140" r="12" fill="#ffffff" opacity="0.14"/>
        <circle cx="470" cy="215" r="14" fill="#ffffff" opacity="0.15"/>
      </g>
    </g>

    <!-- focus subject (person silhouette) -->
    <g transform="translate(268 96)">
      <circle cx="0" cy="30" r="26" fill="#ffd23f"/>
      <path d="M-38 108 q 0 -52 38 -52 q 38 0 38 52 Z" fill="#ffd23f"/>
      <!-- focus reticle -->
      <g fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.95">
        <path d="M-52 0 h -18 v 18"/><path d="M52 0 h 18 v 18"/>
        <path d="M-52 108 h -18 v -18"/><path d="M52 108 h 18 v -18"/>
      </g>
    </g>

    <!-- mode bars (cinematic letterbox) -->
    <rect x="14" y="14" width="532" height="20" fill="#05070c" opacity="0.9"/>
    <rect x="14" y="266" width="532" height="20" fill="#05070c" opacity="0.9"/>

    <!-- REC indicator -->
    <g transform="translate(470 40)">
      <circle cx="0" cy="0" r="6" fill="#ff453a"/>
      <text x="16" y="5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.5">4K 60</text>
    </g>
    <text x="40" y="45" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3cad8" letter-spacing="1.5">00:00:14:22</text>

    <!-- timeline + focus pull -->
    <g transform="translate(40 258)">
      <rect x="0" y="0" width="480" height="4" rx="2" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="0" y="0" width="132" height="4" rx="2" fill="url(#c8rec)"/>
      <circle cx="132" cy="2" r="6" fill="#ffffff"/>
      <path d="M150 -12 C 190 -22, 220 -14, 258 -10 S 330 -4, 370 -10" fill="none" stroke="#ffd23f" stroke-width="2" opacity="0.75"/>
      <text x="376" y="-4" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#ffd23f" letter-spacing="1">FOCUS PULL</text>
    </g>
  </g>

  <!-- feature chips -->
  <g transform="translate(40 382)" font-family="Helvetica,Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="0" y="0" width="166" height="56" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#7ad7ff" stroke-opacity="0.35"/>
      <text x="83" y="24" font-size="13" font-weight="700" fill="#7ad7ff" letter-spacing="1">CINEMATIC</text>
      <text x="83" y="42" font-size="10.5" fill="#8d97ad" letter-spacing="0.8">1080p @ 30fps</text>
    </g>
    <g transform="translate(186 0)">
      <rect x="0" y="0" width="166" height="56" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffd23f" stroke-opacity="0.35"/>
      <text x="83" y="24" font-size="13" font-weight="700" fill="#ffd23f" letter-spacing="1">ACTION MODE</text>
      <text x="83" y="42" font-size="10.5" fill="#8d97ad" letter-spacing="0.8">Stabilised 4K</text>
    </g>
    <g transform="translate(372 0)">
      <rect x="0" y="0" width="188" height="56" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#a8f5c4" stroke-opacity="0.35"/>
      <text x="94" y="24" font-size="13" font-weight="700" fill="#a8f5c4" letter-spacing="1">DOLBY VISION</text>
      <text x="94" y="42" font-size="10.5" fill="#8d97ad" letter-spacing="0.8">HDR up to 60fps</text>
    </g>
  </g>
</svg>